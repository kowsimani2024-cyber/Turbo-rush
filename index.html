<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Turbo Rush</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:linear-gradient(rgba(5,10,30,.5),rgba(5,10,30,.82))}
  #ov h1{margin:0;font-size:clamp(2.2rem,9vw,4rem);letter-spacing:.06em;font-style:italic;color:#ffd400;text-shadow:0 4px 0 #b45309,0 0 30px rgba(255,212,0,.5)}
  #ov p{margin:8px 0;color:#cbd5e1;max-width:360px;line-height:1.45}
  #ov .small{font-size:.9rem;opacity:.8}
  #ov button{margin-top:18px;font:inherit;font-weight:800;font-size:1.2rem;letter-spacing:.05em;padding:16px 36px;border:0;border-radius:999px;background:linear-gradient(#ffe45c,#ffb300);color:#1a1200;box-shadow:0 6px 0 #b45309,0 10px 30px rgba(0,0,0,.4);cursor:pointer}
  #ov button:active{transform:translateY(3px);box-shadow:0 3px 0 #b45309}
  #ov button:disabled{opacity:.6;cursor:wait}
  .hidden{display:none!important}
  .pad{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);display:none;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:#fff}
  .pad.on{background:rgba(255,212,0,.45)}
  @media (pointer:coarse){.pad{display:flex}}
  #left{left:16px}#right{left:112px}#brake{right:16px;font-size:.95rem;width:96px;height:96px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="pad" id="left">◀</div>
<div class="pad" id="right">▶</div>
<div class="pad" id="brake">BRAKE</div>

<div id="ov">
  <h1 id="ttl">TURBO RUSH</h1>
  <p id="msg">Race 7 rivals over 3 laps. Drive through the glowing ⚡ boost pads for a burst of speed. Stay off the trees and rocks.</p>
  <p class="small" id="hint">Keyboard: ← → steer, ↑ gas, ↓ brake<br>Touch: on-screen buttons (gas is automatic)</p>
  <button id="go" disabled>LOADING…</button>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W = 1, H = 1;

// ---------- constants ----------
const TAU = Math.PI * 2;
const STEP = 1 / 60, SEG = 200, RUMBLE = 3, ROAD = 2000, LANES = 3, DRAW = 180;
const CAMH = 1000, FOV = 100, CAMD = 1 / Math.tan(FOV / 2 * Math.PI / 180);
const PLAYERZ = CAMH * CAMD * 1.25;
const MAXSPEED = SEG / STEP, ACCEL = MAXSPEED / 5, BRAKE = -MAXSPEED, DECEL = -MAXSPEED / 5;
const OFFDECEL = -MAXSPEED / 2, OFFLIMIT = MAXSPEED / 4;
const CENTRIF = 0.3, TURBO = 1.5, LAPS = 3, NCARS = 7, CARW = 560;
const CAR_W_OFF = CARW / ROAD, FOGD = 4.2;
const HAZE = '#d6e4ea';
const CAR_COLORS = ['#d11a2a', '#1f4fd8', '#f2f3f5', '#14161a', '#9aa3ad', '#e8731a', '#0f8b6d', '#6d28d9'];

// ---------- utils ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const easeIn = (a, b, p) => a + (b - a) * p * p;
const easeInOut = (a, b, p) => a + (b - a) * ((-Math.cos(p * Math.PI) / 2) + 0.5);
const increase = (s, inc, max) => { let r = s + inc; while (r >= max) r -= max; while (r < 0) r += max; return r; };
const pctRem = (n, total) => (n % total) / total;
const fogF = (d, den) => 1 / Math.pow(Math.E, d * d * den);
const overlap = (x1, w1, x2, w2, pc) => {
  const h = (pc || 1) / 2;
  return !((x1 + w1 * h) < (x2 - w2 * h) || (x1 - w1 * h) > (x2 + w2 * h));
};
function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function mkc(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
const hex2rgb = h => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const css = c => 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')';
const rgbaS = (c, a) => 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
function rrc(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
const rr = (x, y, w, h, r) => rrc(ctx, x, y, w, h, r);
function makeNoise(seed, cell, w, h) {
  const nx = Math.ceil(w / cell), ny = Math.ceil(h / cell) + 2, r = rng(seed), g = new Float32Array(nx * ny);
  for (let i = 0; i < g.length; i++) g[i] = r();
  return (x, y) => {
    x /= cell; y /= cell;
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const x0 = ((xi % nx) + nx) % nx, x1 = (x0 + 1) % nx, y0 = clamp(yi, 0, ny - 1), y1 = clamp(yi + 1, 0, ny - 1);
    const sx = xf * xf * (3 - 2 * xf), sy = yf * yf * (3 - 2 * yf);
    const a = g[y0 * nx + x0], b = g[y0 * nx + x1], c = g[y1 * nx + x0], d = g[y1 * nx + x1];
    return lerp(lerp(a, b, sx), lerp(c, d, sx), sy);
  };
}

// =====================================================================
//  PROCEDURAL ART  (everything is painted once at load into canvases)
// =====================================================================

// ---------- cars (rear view) ----------
const STYLES = [
  { bw: .95, roof: 92,  belt: 206, cabW: .60, cabB: .82, wing: 'gt',   ex: [.30],      lights: 'bar'   },  // sports coupe
  { bw: .88, roof: 66,  belt: 204, cabW: .66, cabB: .80, wing: 'lip',  ex: [.34],      lights: 'split' },  // sedan
  { bw: .90, roof: 38,  belt: 196, cabW: .74, cabB: .86, wing: 'roof', ex: [],         lights: 'tall'  },  // SUV
  { bw: .98, roof: 112, belt: 214, cabW: .56, cabB: .86, wing: 'gt2',  ex: [.22, .40], lights: 'bar'   }   // supercar
];
const STATES = ['MH 12', 'KA 05', 'DL 8C', 'TN 09', 'GJ 01', 'RJ 14', 'UP 32', 'KL 07'];

function makeCar(color, st, brake, plate) {
  const [c, g] = mkc(512, 320); g.scale(.8, .8);
  const cx = 320, gy = 372, bh = st.bw * 320, belt = st.belt, roof = st.roof;
  const base = hex2rgb(color), LC = mixc(base, [255, 255, 255], .55), DC = mixc(base, [0, 0, 0], .38), DD = mixc(base, [0, 0, 0], .7);
  const bumpTop = Math.max(belt + 92, 296), bumpBot = 340;

  // ground shadow
  g.save(); g.translate(cx, gy + 6); g.scale(1, .15);
  let sg = g.createRadialGradient(0, 0, 0, 0, 0, bh * 1.25);
  sg.addColorStop(0, 'rgba(0,0,0,.85)'); sg.addColorStop(.7, 'rgba(0,0,0,.45)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = sg; g.beginPath(); g.arc(0, 0, bh * 1.25, 0, TAU); g.fill(); g.restore();

  // tyres
  const tw = 70, th = 106;
  for (const s of [-1, 1]) {
    const x = s < 0 ? cx - bh + 6 : cx + bh - 6 - tw;
    const tg = g.createLinearGradient(x, 0, x + tw, 0);
    tg.addColorStop(0, '#050505'); tg.addColorStop(.5, '#2b2b2e'); tg.addColorStop(1, '#050505');
    g.fillStyle = tg; rrc(g, x, gy - th, tw, th, 18); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.09)'; g.lineWidth = 1.2;
    for (let i = 0; i < 8; i++) { const yy = gy - th + 40 + i * 8.5; g.beginPath(); g.moveTo(x + 8, yy); g.lineTo(x + tw - 8, yy); g.stroke(); }
  }
  // underbody
  let ug = g.createLinearGradient(0, bumpTop, 0, gy);
  ug.addColorStop(0, 'rgba(0,0,0,.95)'); ug.addColorStop(1, 'rgba(12,12,14,.65)');
  g.fillStyle = ug; g.fillRect(cx - bh + 40, bumpTop, bh * 2 - 80, gy - bumpTop - 2);

  // main body
  const top = belt - 30, bot = bumpTop + 8, R = 46;
  const bodyPath = () => {
    g.beginPath(); g.moveTo(cx - bh + 30, top);
    g.quadraticCurveTo(cx - bh + 4, top + 2, cx - bh, top + 34);
    g.lineTo(cx - bh, bot - R); g.quadraticCurveTo(cx - bh, bot, cx - bh + R, bot);
    g.lineTo(cx + bh - R, bot); g.quadraticCurveTo(cx + bh, bot, cx + bh, bot - R);
    g.lineTo(cx + bh, top + 34); g.quadraticCurveTo(cx + bh - 4, top + 2, cx + bh - 30, top); g.closePath();
  };
  bodyPath();
  let bg = g.createLinearGradient(0, top, 0, bot);
  bg.addColorStop(0, css(LC)); bg.addColorStop(.1, color); bg.addColorStop(.62, css(DC)); bg.addColorStop(1, css(DD));
  g.fillStyle = bg; g.fill();
  g.save(); bodyPath(); g.clip();
  let sh = g.createLinearGradient(cx - bh, 0, cx + bh, 0);
  sh.addColorStop(0, 'rgba(0,0,0,.6)'); sh.addColorStop(.16, 'rgba(0,0,0,.1)'); sh.addColorStop(.5, 'rgba(0,0,0,0)');
  sh.addColorStop(.84, 'rgba(255,255,255,.07)'); sh.addColorStop(1, 'rgba(0,0,0,.42)');
  g.fillStyle = sh; g.fillRect(cx - bh, top, bh * 2, bot - top);
  let rf = g.createLinearGradient(0, top, 0, top + 80);
  rf.addColorStop(0, 'rgba(255,255,255,.42)'); rf.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = rf; g.fillRect(cx - bh, top, bh * 2, 80);
  g.strokeStyle = 'rgba(0,0,0,.3)'; g.lineWidth = 2; g.beginPath(); g.moveTo(cx - bh + 8, belt + 84); g.lineTo(cx + bh - 8, belt + 84); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.25)'; g.beginPath(); g.moveTo(cx - bh + 8, belt + 86); g.lineTo(cx + bh - 8, belt + 86); g.stroke();
  g.restore();

  // rear bumper (plastic) + diffuser
  g.save(); rrc(g, cx - bh + 62, bumpTop, bh * 2 - 124, bumpBot - bumpTop, 20);
  let pg = g.createLinearGradient(0, bumpTop, 0, bumpBot);
  pg.addColorStop(0, '#2a2b2e'); pg.addColorStop(.5, '#151618'); pg.addColorStop(1, '#08090a');
  g.fillStyle = pg; g.fill(); g.clip();
  g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = 2;
  for (let i = -7; i <= 7; i++) { g.beginPath(); g.moveTo(cx + i * 26, bumpTop + 14); g.lineTo(cx + i * 31, bumpBot); g.stroke(); }
  g.restore();
  g.fillStyle = '#b3141c';
  for (const s of [-1, 1]) { rrc(g, s < 0 ? cx - bh + 70 : cx + bh - 98, bumpTop + 6, 28, 10, 3); g.fill(); }

  // cabin
  const cb = st.cabB * bh, ct = st.cabW * bh;
  const cabinPath = () => {
    g.beginPath(); g.moveTo(cx - cb, belt - 20); g.lineTo(cx - ct - 6, roof + 28);
    g.quadraticCurveTo(cx - ct + 4, roof, cx - ct + 36, roof); g.lineTo(cx + ct - 36, roof);
    g.quadraticCurveTo(cx + ct - 4, roof, cx + ct + 6, roof + 28); g.lineTo(cx + cb, belt - 20); g.closePath();
  };
  cabinPath();
  let cg = g.createLinearGradient(0, roof, 0, belt);
  cg.addColorStop(0, css(LC)); cg.addColorStop(.25, color); cg.addColorStop(1, css(DC));
  g.fillStyle = cg; g.fill();
  g.save(); cabinPath(); g.clip();
  let cs = g.createLinearGradient(cx - cb, 0, cx + cb, 0);
  cs.addColorStop(0, 'rgba(0,0,0,.55)'); cs.addColorStop(.2, 'rgba(0,0,0,0)'); cs.addColorStop(.85, 'rgba(255,255,255,.06)'); cs.addColorStop(1, 'rgba(0,0,0,.4)');
  g.fillStyle = cs; g.fillRect(cx - cb, roof, cb * 2, belt - roof); g.restore();
  // rear glass
  const gl = cb - 22, gt = ct - 16, gTop = roof + 15, gBot = belt - 36;
  const glassPath = () => {
    g.beginPath(); g.moveTo(cx - gl, gBot); g.lineTo(cx - gt - 4, gTop + 24);
    g.quadraticCurveTo(cx - gt + 2, gTop, cx - gt + 30, gTop); g.lineTo(cx + gt - 30, gTop);
    g.quadraticCurveTo(cx + gt - 2, gTop, cx + gt + 4, gTop + 24); g.lineTo(cx + gl, gBot); g.closePath();
  };
  glassPath();
  let gg = g.createLinearGradient(0, gTop, 0, gBot);
  gg.addColorStop(0, '#2d4358'); gg.addColorStop(.5, '#101c28'); gg.addColorStop(1, '#05090d');
  g.fillStyle = gg; g.fill();
  g.save(); glassPath(); g.clip();
  let sk = g.createLinearGradient(cx - gl, gTop, cx + gl * .3, gBot);
  sk.addColorStop(0, 'rgba(190,225,255,.5)'); sk.addColorStop(.45, 'rgba(190,225,255,.12)'); sk.addColorStop(1, 'rgba(190,225,255,0)');
  g.fillStyle = sk; g.fillRect(cx - gl, gTop, gl * 2, gBot - gTop);
  g.fillStyle = 'rgba(255,255,255,.1)'; g.beginPath();
  g.moveTo(cx + gt * .15, gTop); g.lineTo(cx + gt * .55, gTop); g.lineTo(cx + gl * .35, gBot); g.lineTo(cx - gl * .05, gBot); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 1.4;
  for (let i = 1; i < 5; i++) { const yy = gBot - i * 5.5; g.beginPath(); g.moveTo(cx - gl, yy); g.lineTo(cx + gl, yy); g.stroke(); }
  g.restore();
  // high-mount brake light
  g.fillStyle = brake ? '#ff3a2e' : '#7c0f16'; rrc(g, cx - 56, gBot - 14, 112, 7, 3); g.fill();
  if (brake) { g.fillStyle = 'rgba(255,200,190,.9)'; g.fillRect(cx - 44, gBot - 12, 88, 2); }

  // mirrors
  g.fillStyle = css(DC);
  for (const s of [-1, 1]) { g.beginPath(); g.ellipse(cx + s * (cb + 16), belt - 58, 20, 12, 0, 0, TAU); g.fill(); g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 2; g.stroke(); }

  // spoilers / wings / roof gear
  const dk = '#111214', dkHi = '#3b3d42';
  if (st.wing === 'gt' || st.wing === 'gt2') {
    const wy = st.wing === 'gt' ? belt - 70 : belt - 86;
    g.fillStyle = dk; g.fillRect(cx - bh * .42 - 5, wy + 16, 10, belt - 28 - wy - 16); g.fillRect(cx + bh * .42 - 5, wy + 16, 10, belt - 28 - wy - 16);
    rrc(g, cx - bh * .98, wy, bh * 1.96, 20, 5); g.fill();
    g.fillStyle = dkHi; g.fillRect(cx - bh * .96, wy + 1, bh * 1.92, 3);
    g.fillStyle = dk; g.fillRect(cx - bh * .98, wy - 10, 9, 44); g.fillRect(cx + bh * .98 - 9, wy - 10, 9, 44);
  } else if (st.wing === 'lip') {
    rrc(g, cx - bh * .78, belt - 38, bh * 1.56, 11, 5); g.fillStyle = css(DC); g.fill();
    g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(cx - bh * .74, belt - 37, bh * 1.48, 2);
  } else if (st.wing === 'roof') {
    rrc(g, cx - ct * .78, roof - 6, ct * 1.56, 14, 5); g.fillStyle = dk; g.fill();
    g.fillStyle = dkHi; g.fillRect(cx - ct * .74, roof - 5, ct * 1.48, 2);
    g.fillStyle = '#222'; g.fillRect(cx - cb - 2, roof + 30, 8, belt - roof - 60); g.fillRect(cx + cb - 6, roof + 30, 8, belt - roof - 60);
  }

  // tail lights
  const lampShape = side => {
    g.save(); g.translate(cx, 0); g.scale(side, 1);
    const o = bh - 12, i = bh * .16, y0 = belt - 2;
    g.beginPath();
    if (st.lights === 'bar') { g.moveTo(o, y0); g.lineTo(i, y0 + 14); g.lineTo(i, y0 + 34); g.lineTo(o - 8, y0 + 50); }
    else if (st.lights === 'split') { g.moveTo(o, y0 - 6); g.lineTo(o * .5, y0 - 2); g.lineTo(o * .5, y0 + 38); g.lineTo(o - 6, y0 + 50); }
    else { g.moveTo(o - 4, y0 - 38); g.lineTo(o - 40, y0 - 38); g.lineTo(o - 40, y0 + 62); g.lineTo(o - 4, y0 + 62); }
    g.closePath();
    let lg = g.createLinearGradient(0, y0, 0, y0 + 50);
    if (brake) { lg.addColorStop(0, '#ff6a52'); lg.addColorStop(.5, '#ff2a1c'); lg.addColorStop(1, '#c70f10'); }
    else { lg.addColorStop(0, '#7a0e14'); lg.addColorStop(.5, '#a3121a'); lg.addColorStop(1, '#4e070c'); }
    g.fillStyle = lg; g.fill(); g.lineJoin = 'round'; g.strokeStyle = 'rgba(0,0,0,.65)'; g.lineWidth = 3; g.stroke();
    g.clip();
    g.strokeStyle = brake ? 'rgba(255,225,210,.85)' : 'rgba(255,90,90,.45)'; g.lineWidth = 3;
    for (let k = 0; k < 3; k++) { g.beginPath(); g.moveTo(i + 6, y0 + 20 + k * 6); g.lineTo(o - 14, y0 + 14 + k * 7); g.stroke(); }
    g.restore();
  };
  lampShape(-1); lampShape(1);
  if (st.lights === 'bar') { g.fillStyle = brake ? '#ff3a2e' : '#6e0b11'; g.fillRect(cx - bh * .16, belt + 14, bh * .32, 8); }
  g.fillStyle = '#c9ccd2'; g.beginPath(); g.arc(cx, belt + 44, 14, 0, TAU); g.fill();
  g.fillStyle = '#2a2d33'; g.beginPath(); g.arc(cx, belt + 44, 9, 0, TAU); g.fill();
  if (brake) {
    g.save(); g.globalCompositeOperation = 'lighter';
    for (const s of [-1, 1]) {
      const lx = cx + s * (bh * .58), ly = belt + 22;
      const gr = g.createRadialGradient(lx, ly, 6, lx, ly, 120);
      gr.addColorStop(0, 'rgba(255,70,50,.7)'); gr.addColorStop(1, 'rgba(255,40,20,0)');
      g.fillStyle = gr; g.fillRect(lx - 130, ly - 130, 260, 260);
    }
    g.restore();
  }

  // number plate
  const px = cx - 74, py = belt + 62, pw = 148, ph = 46;
  rrc(g, px - 4, py - 4, pw + 8, ph + 8, 7); g.fillStyle = '#0a0a0a'; g.fill();
  rrc(g, px, py, pw, ph, 5); let plg = g.createLinearGradient(0, py, 0, py + ph);
  plg.addColorStop(0, '#fbfbf6'); plg.addColorStop(1, '#d9d9cf'); g.fillStyle = plg; g.fill();
  g.fillStyle = '#1b3f9a'; g.fillRect(px, py, 18, ph);
  g.fillStyle = '#fff'; g.font = '700 9px sans-serif'; g.textAlign = 'center'; g.fillText('IND', px + 9, py + ph - 8);
  g.fillStyle = '#e8e8e8'; g.beginPath(); g.arc(px + 9, py + 14, 5, 0, TAU); g.fill();
  g.fillStyle = '#111'; g.font = '800 23px "Arial Narrow",Arial,sans-serif'; g.textAlign = 'center';
  g.fillText(plate[0], px + 18 + (pw - 18) / 2, py + 21); g.fillText(plate[1], px + 18 + (pw - 18) / 2, py + 42);

  // exhausts
  for (const f of st.ex) for (const s of [-1, 1]) {
    const ex = cx + s * f * bh, ey = bumpBot - 12;
    let eg = g.createRadialGradient(ex - 6, ey - 6, 2, ex, ey, 26);
    eg.addColorStop(0, '#ffffff'); eg.addColorStop(.5, '#9aa0a8'); eg.addColorStop(1, '#3d4147');
    g.fillStyle = eg; g.beginPath(); g.ellipse(ex, ey, 25, 18, 0, 0, TAU); g.fill();
    let ig = g.createRadialGradient(ex, ey, 2, ex, ey, 17);
    ig.addColorStop(0, '#000'); ig.addColorStop(1, '#1a1a1c');
    g.fillStyle = ig; g.beginPath(); g.ellipse(ex, ey + 1, 18, 12, 0, 0, TAU); g.fill();
  }

  // outline + final glossy line
  bodyPath(); g.strokeStyle = 'rgba(0,0,0,.55)'; g.lineWidth = 2.5; g.stroke();
  cabinPath(); g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 2; g.stroke();
  return c;
}

// ---------- vegetation ----------
function leafBlob(g, x, y, r, lit, base) {
  const hi = mixc(base, [205, 235, 120], .5), lo = mixc(base, [5, 26, 10], .72);
  const gr = g.createRadialGradient(x + r * .32, y - r * .36, r * .05, x, y, r);
  gr.addColorStop(0, css(mixc(lo, hi, lit)));

  const sy = pad + fs * 4.3, sx0 = pad, sx1 = W - pad, total = LAPS * trackLength;
  ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(sx0, sy - 3, sx1 - sx0, 6, 3); ctx.fill();
  for (const c of cars) {
    const px = sx0 + (sx1 - sx0) * clamp(carProgress(c) / total, 0, 1);
    ctx.fillStyle = c.color; ctx.beginPath(); ctx.arc(px, sy, fs * .2, 0, TAU); ctx.fill();
  }
  const ppx = sx0 + (sx1 - sx0) * clamp(playerProgress() / total, 0, 1);
  ctx.fillStyle = '#ffd400'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(ppx, sy, fs * .32, 0, TAU); ctx.fill(); ctx.stroke();

  if (turbo > 0) {
    const bw = Math.min(W * .5, 260), bx = (W - bw) / 2, by = sy + fs * 1.2;
    ctx.fillStyle = 'rgba(0,0,0,.5)'; rr(bx, by, bw, fs * .45, fs * .22); ctx.fill();
    ctx.fillStyle = '#4cc9ff'; rr(bx, by, bw * clamp(turbo / 6, 0, 1), fs * .45, fs * .22); ctx.fill();
    text('⚡ TURBO', W / 2, by + fs * 1.35, fs * .9, 'center', '#9be7ff');
  }
  if (state === 'countdown') {
    const n = Math.ceil(cdT);
    if (n >= 1 && n <= 3) text(String(n), W / 2, H * .34, u * .3, 'center', '#ffd400');
    else text('READY', W / 2, H * .34, u * .16, 'center', '#fff');
  } else if (goT > 0) text('GO!', W / 2, H * .34, u * .26, 'center', '#34d399');
  if (state === 'finished') text('FINISH!', W / 2, H * .34, u * .18, 'center', '#ffd400');
}

// ---------- overlay / input ----------
function ordinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function showFinish() {
  $('ttl').textContent = finalRank === 1 ? '🏆 YOU WON!' : '🏁 ' + ordinal(finalRank) + ' PLACE';
  $('msg').textContent = 'Finished ' + ordinal(finalRank) + ' of ' + (NCARS + 1) + ' in ' + fmtTime(finalTime) + '.' +
    (finalRank === 1 ? ' Brilliant driving!' : ' Hit more boost pads and keep clear of the trees next time.');
  $('hint').classList.add('hidden');
  $('go').textContent = 'RACE AGAIN';
  $('ov').classList.remove('hidden');
}
$('go').addEventListener('click', () => {
  if ($('go').disabled) return;
  initAudio();
  if (ac && ac.state === 'suspended') ac.resume();
  $('ov').classList.add('hidden');
  resetRace();
});
function setKey(e, v) {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = v;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = v;
  else if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.gas = v;
  else if (k === 'ArrowDown' || k === 's' || k === 'S' || k === ' ') keys.brake = v;
  else return;
  e.preventDefault();
}
addEventListener('keydown', e => setKey(e, true));
addEventListener('keyup', e => setKey(e, false));
function bindPad(id, key) {
  const el = $(id);
  const on = e => { e.preventDefault(); keys[key] = true; el.classList.add('on'); };
  const off = e => { e.preventDefault(); keys[key] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, off));
  el.addEventListener('contextmenu', e => e.preventDefault());
}
bindPad('left', 'left'); bindPad('right', 'right'); bindPad('brake', 'brake');

// ---------- boot ----------
let ready = false, last = 0, gdt = 0;
function frame(now) {
  if (ready) {
    const dt = Math.min(.25, (now - last) / 1000); last = now; gdt += dt;
    while (gdt > STEP) {
      gdt -= STEP; update(STEP);
      if (state === 'finished' && finishT > 1.6 && $('ov').classList.contains('hidden')) showFinish();
    }
    render();
  } else last = now;
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
setTimeout(() => {
  try {
    buildAssets();
    buildTrack();
    initCars();
    ready = true;
    $('go').disabled = false; $('go').textContent = 'START RACE';
  } catch (e) {
    $('go').textContent = 'ERROR: ' + e.message;
    console.error(e);
  }
}, 30);
window.__turbo = { get state() { return state; }, get ready() { return ready; } };
})();
</script>
